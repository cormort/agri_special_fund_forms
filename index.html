<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>農業特別收入基金 表單定義</title>
<meta http-equiv="refresh" content="0; url=./demo/">
<link rel="canonical" href="./demo/">
<style>
  body { font-family: "Noto Sans TC", system-ui, sans-serif; background: #f6f8fb; color: #1f2933;
         display: grid; place-items: center; height: 100vh; margin: 0; }
  .box { text-align: center; line-height: 1.8; }
  a { color: #6d28d9; }
</style>
</head>
<body>
  <div class="box">
    <p>正在前往 <b>表單預覽</b>…</p>
    <p><a href="./demo/">若沒有自動跳轉，請點這裡</a></p>
  </div>
  <script>
    // meta refresh 有時會被擴充功能或快取擋住，這裡再補一次
    if (!/\/demo\//.test(location.pathname)) location.replace('./demo/');
  </script>
</body>
</html>
